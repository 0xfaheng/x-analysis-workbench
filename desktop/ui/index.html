<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 分析工作台</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><strong>X 分析工作台</strong><span id="account"></span></div>
    <nav aria-label="工具栏">
      <button data-job="login">登录 X</button>
      <button data-job="collect">仅更新数据</button>
      <button data-job="render" title="使用所选期已有数据，保留已写建议">重新生成网页</button>
      <span id="assistant-help"><button data-job="assistant" disabled>生成完整周报</button></span>
      <button id="toggle-log" aria-expanded="false">运行日志</button>
      <details id="more"><summary>更多</summary><div class="menu">
        <button data-path="root">打开工作台文件夹</button>
        <button data-path="data">打开数据文件夹</button>
        <button data-path="report">打开本期 report.md</button>
        <button data-path="strategy">策略基线</button>
        <button data-path="workflow">周报流程</button>
        <button data-path="config">编辑 config.json</button>
      </div></details>
    </nav>
  </header>
  <div class="workspace">
    <aside aria-label="历次周报"><h2>每周报告</h2><div id="reports"></div><p id="count"></p></aside>
    <main>
      <div id="empty" role="status"><h1>还没有周报</h1><p id="guide"></p></div>
      <iframe id="report" title="所选周报" sandbox="allow-scripts allow-same-origin" hidden></iframe>
      <section id="logs" aria-label="运行日志" hidden><h2>运行日志</h2><pre id="log">还没有运行记录</pre></section>
    </main>
  </div>
  <footer id="status" role="status">正在加载工作台…</footer>
</body>
</html>
