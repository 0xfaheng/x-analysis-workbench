name: Windows 安装包与发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      XWB_BROWSER_TESTS: '1'
      XWB_BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-windows.txt
      - name: 读取版本并校验标签
        shell: pwsh
        run: |
          $Version = (python scripts/version.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw "无法读取版本" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -cne "v$Version") {
            throw "标签 $env:GITHUB_REF_NAME 与 scripts/version.py 中的 $Version 不一致"
          }
          "APP_VERSION=$Version" >> $env:GITHUB_ENV
          python packaging/release_notes.py --version $Version --out release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "缺少对应版本的更新记录" }
      - name: 测试、打包及冻结包冒烟
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: XWorkbench-${{ env.APP_VERSION }}-Windows
          if-no-files-found: error
          path: |
            dist/XWorkbench-Setup-${{ env.APP_VERSION }}.exe
            dist/XWorkbench-${{ env.APP_VERSION }}-portable.zip
      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "X 分析工作台 v$env:APP_VERSION" --notes-file release-notes.md "dist/XWorkbench-Setup-$env:APP_VERSION.exe" "dist/XWorkbench-$env:APP_VERSION-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
