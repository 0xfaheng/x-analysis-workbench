name: 测试
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      XWB_BROWSER_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      XWB_BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-windows.txt
      - run: python -m pip install -r requirements.txt "pywebview>=6.2,<7"
      - run: python -m unittest discover -s tests
